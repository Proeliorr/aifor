# Single config for the whole pipeline. Each top-level section configures one stage;
# each entry script reads only its own section. Override on the CLI with the section
# prefix, e.g. `threedfin.plots=[plot_01]` or `threedfin.dry_run=true`.

# ============================================================================
# Semantic class scheme — SegmentedForests labels -> ForAINet labels
#
# NOT A STAGE: nothing runs this on its own, there is no engine behind it. It is
# plain config, interpolated by both stages that touch labels
# (`class_unifier:` and `forainet_prep:`), so the diagnostic exports and the PLYs
# ForAINet actually trains on can never disagree about what a class number means.
#
# Nothing about this block is ForAINet-specific machinery — it is plain config.
# Pointing the pipeline at another dataset means a different `class_map` and
# field names, not a code change; the scheme below is simply the default.
#
# HYDRA GOTCHA (measured, not guessed — the keys here are INTEGERS, which makes
# CLI overrides awkward):
#   classes.class_map.5=1        -> FAILS "Key '5' is not in struct" (the override
#                                   parser hands over a string key; the map's are ints)
#   classes.class_map={99: 0}    -> FAILS the same way (it merges into a struct)
#   ++classes.class_map={99: 0}  -> merges, adding that entry (17 entries)
#   class_unifier.class_map={..} -> REPLACES the stage's map wholesale, severing the
#                                   link to this block, so forainet_prep still uses
#                                   the one below and the two stages disagree
# In short: change the scheme by editing this file. Reserve the CLI for one-off
# experiments, and never for a run whose output feeds training.
# ============================================================================

classes:
  # Source column holding the ground-truth label, and the tree/instance id.
  # Stated explicitly rather than left to auto-detection: picking the wrong
  # column silently is exactly the failure mode this stage exists to prevent.
  semantic_field: Class
  tree_id_field: tree_ID
  # Name of the NEW column receiving the remapped labels.
  unified_field: semantic_seg

  # Points whose mapped label equals `drop_value` are physically removed from the
  # output; `null` keeps every point.
  #
  # Currently INERT: nothing in the map below targets -1, so nothing is dropped.
  # That is deliberate. The classes with no ForAINet counterpart (8, 9, 11) are
  # sent to 0 = "unclassified" instead, and ForAINet's reader subtracts one
  # (`semantic_seg - 1`, see datasets/segmentation/treeins_set1.py), turning 0
  # into -1 = IGNORE_LABEL. Its losses pass that as `ignore_index`, so those
  # points contribute no loss and no gradient but STAY in the cloud -- their
  # geometry still supports the neighbourhood features of the points around them.
  # Deleting them instead would punch holes in the cloud and change what every
  # nearby point sees.
  #
  # Kept as a safety valve: map a class to -1 here if you ever do want it gone.
  drop_value: -1

  # {SegmentedForests Class: ForAINet semantic_seg}. Several sources sharing a
  # target merge those classes. Verified complete against all 14 plots: the
  # union of `Class` over the dataset is exactly the 16 keys below.
  class_map:
    # no ForAINet counterpart -> dropped
    8: 0
    9: 0
    11: 0
    # -> 1 low_vegetation
    0: 1
    4: 1
    5: 1
    6: 1
    7: 1
    12: 1
    13: 1
    22: 1
    23: 1
    # -> 2 ground
    1: 2
    # -> 3 stem_points
    3: 3
    10: 3
    # -> 4 live_branches
    2: 4

  # The unified scheme, echoed into every sidecar. ForAINet's class 4
  # ("branches") is absent: SegmentedForests has no corresponding label, so it
  # was removed from the framework too (see patches/forainet-local.patch).
  class_names:
    0: unclassified      # ForAINet maps this to -1 and ignores it
    1: low_vegetation
    2: ground
    3: stem_points
    4: live_branches

  # Which of the classes above are made of INDIVIDUAL TREES ("thing" classes).
  # Values use the same numbering as `class_names` right above.
  #
  # Everything else is "stuff" (ground, undergrowth) and must carry tree id 0,
  # meaning "not part of any tree" -- that is the convention ForAINet's own files
  # follow, where low_vegetation/ground are id 0 for 100% of their points.
  #
  # 3DFin does NOT follow it: it gives every point the id of the nearest stem, so
  # the ground and undergrowth beneath a tree inherit that tree's id (one measured
  # example: id 114189 covered 3.0M points, of which 1.6M were ground and low
  # vegetation). ForAINet's set_extra_labels() then skips any instance whose id
  # also appears on a stuff point -- which, with 3DFin ids, is every single one:
  # 0 of 42 tree instances survived on plot_10.
  #
  # So Stage 2 zeroes the tree id outside these classes. `null` disables that and
  # passes the ids through untouched.
  instance_classes: [3, 4]     # stem_points, live_branches

# ============================================================================
# Stage 1 — 3DFin instance segmentation (adds tree_ID per point). This data will be used for training the instance segmentation head.
#   run with: python main_pipeline.py   (engine: pipeline/threedfin.py)
# ============================================================================
threedfin:
  # --- Input / output folders (edit these) ---
  pointclouds_dir: D:\Podyplomowe\04_AI_Intro\assignment\SegmentedForests\pointclouds
  ini_dir:         D:\Podyplomowe\04_AI_Intro\assignment\SegmentedForests\3DFin_settings
  output_dir:      D:\Podyplomowe\04_AI_Intro\assignment\SegmentedForests\3DFin_output

  # --- 3DFin binary (aifor env) ---
  threedfin_bin: C:/ProgramData/miniforge3/envs/aifor/Scripts/3DFin.exe

  # --- 3DFin CLI flags ---
  # null = derive from each plot's .ini [misc] (recommended); true/false = force for all plots.
  # Note 3DFin maps `is_normalized = not --normalize`: the dataset clouds are NOT height-
  # normalized (is_normalized=False), so deriving from the .ini passes --normalize.
  normalize: null
  denoise: null
  export_txt: null

  # --- Run control ---
  pattern: "*.laz"
  plots: null               # null = all plots; or a list like [plot_01, plot_05]
  prune_outputs: true       # keep only <plot>_tree_ID_dist_axes.las + 3dfin_log.txt per plot; false = keep all 3DFin files
  dry_run: false
  continue_on_error: true

# ============================================================================
# Class unifier (optional, diagnostic) — apply the `classes:` scheme and export a
# cloud to LOOK AT in misc/view_split_point_cloud.ipynb. Nothing downstream reads
# its output: the labels ForAINet trains on are written by Stage 2 below, from the
# same shared map.
#   run with: python class_unifier.py   (engine: pipeline/class_unifier.py)
# ============================================================================
class_unifier:
  # --- Input / output (edit these) ---
  # Inputs may be .las (1.2-1.4), .laz or .ply; `patterns` are matched directly in
  # input_dir (flat layout) AND one level down in per-plot subfolders (the 3DFin
  # output tree). Default input = Stage 1 results.
  input_dir:  D:\Podyplomowe\04_AI_Intro\assignment\SegmentedForests\3DFin_output
  patterns: ["*.las", "*.laz", "*.ply"]
  # Folder receiving <plot>.<ply|npy> + <plot>.json (created if missing).
  output_dir: D:\Podyplomowe\04_AI_Intro\assignment\SegmentedForests\ClassUnifier_output

  # What to write: ply | npy | both. The .json sidecar is written either way.
  #
  # `ply` (default) is the one to inspect in misc/view_split_point_cloud.ipynb: a PLY
  # keeps each column's real dtype, and the viewer only draws a class legend (and
  # unique counts, and one histogram bar per class) for INTEGER columns. The .npy is a
  # plain float64 matrix, so there every label column looks continuous — a viridis ramp
  # instead of the class colours, which defeats the point of checking a merge. The PLY
  # is smaller too (~32 vs 56 bytes/point).
  #
  # `npy` stays available for loading straight into numpy; `both` writes the pair.
  output_format: ply

  # --- Source field names ---
  # Taken from the shared `classes:` block above. intensity has no bearing on the
  # label scheme, so it stays local; null = auto-detect
  # (intensity/scalar_Intensity/...). A configured name missing from a file fails
  # that plot loudly instead of silently writing zeros.
  semantic_field: ${classes.semantic_field}
  tree_id_field: ${classes.tree_id_field}
  intensity_field: null

  # --- The unification (shared with forainet_prep; see `classes:` above) ---
  unified_field: ${classes.unified_field}
  class_map: ${classes.class_map}
  drop_value: ${classes.drop_value}
  class_names: ${classes.class_names}

  # --- Run control ---
  plots: null               # null = all plots; or a list like [plot_01, plot_05]
  # false = skip plots whose output for the SELECTED output_format already exists
  # (with `both`, only when the .ply and the .npy are both there).
  overwrite: true
  dry_run: false
  continue_on_error: true

  # --- Parallelism (see pipeline/parallel.py) ---
  # Plots are independent, so several are processed at once. The limit is RAM, not
  # cores: these clouds run from 19M to 280M points and cost ~140 bytes/point
  # (measured), so the biggest needs ~39 GB on its own and a worker per core would
  # exhaust the machine. Each plot's size is read from its LAS header (instant) and
  # work is admitted only while it still fits the budget — so a huge plot runs
  # nearly alone while small ones pack several deep.
  workers: null             # null = as many as the budget allows (capped by CPU count);
                            # an int caps concurrency; 1 = inline, exactly as before
  memory_budget_frac: 0.7   # of total RAM; the rest is headroom for the OS
  bytes_per_point: 140      # MEASURED peak RSS per point (plot_09: 72.6M pts -> 9.1 GB)

# ============================================================================
# Stage 2 — prepare plots for ForAINet (center coordinates + PLY) / restore results
#   run with: python forainet_prep.py   (engine: pipeline/forainet_prep.py)
# ============================================================================
forainet_prep:
  # --- Mode ---
  # preprocess = input clouds -> centered ForAINet PLYs + per-plot <plot>_offsets.yml
  #              (the yml also records source format, LAS version/point format/scales
  #              and the CRS as WKT, so restoration is faithful)
  # restore    = classified PLYs -> original coordinates (shifts added back)
  mode: preprocess

  # --- preprocess mode: input / output (edit these) ---
  # Input clouds may be .las (1.2-1.4), .laz or .ply — the processing is identical.
  # `patterns` are matched directly in input_dir (flat layout) AND one level down in
  # per-plot subfolders (the 3DFin output tree). Narrow to ["*_tree_ID_dist_axes.las"]
  # when plot folders hold more than one matching cloud (e.g. prune_outputs=false).
  input_dir:  D:\Podyplomowe\04_AI_Intro\assignment\SegmentedForests\3DFin_output
  patterns: ["*.las", "*.laz", "*.ply"]
  # Folder receiving <plot>.ply + <plot>_offsets.yml (created if missing).
  output_dir: D:\Podyplomowe\04_AI_Intro\assignment\SegmentedForests\ForAINet_input

  # --- preprocess mode: source field names ---
  # Label and tree-id columns come from the shared `classes:` block at the top of
  # this file. intensity is unrelated to the label scheme, so it stays local;
  # null = auto-detect (intensity/scalar_Intensity/...). A configured name missing
  # from a file fails that plot loudly instead of silently writing zeros.
  semantic_field: ${classes.semantic_field}
  tree_id_field: ${classes.tree_id_field}
  intensity_field: null

  # --- preprocess mode: the class scheme (SAME map as class_unifier) ---
  # The PLYs written here are what ForAINet trains on, so they carry the unified
  # labels; without this the framework would still see the raw source classes.
  # Points mapped to `drop_value` are removed BEFORE centering, so the offsets and
  # statistics in <plot>_offsets.yml describe exactly the points in the PLY.
  class_map: ${classes.class_map}
  drop_value: ${classes.drop_value}
  # Points outside these classes get tree id 0 ("not part of any tree"), which is
  # what ForAINet's instance grouping requires -- see the note in `classes:`.
  instance_classes: ${classes.instance_classes}

  # --- restore mode ---
  restore_dir: null         # folder of classified *.ply to restore (required for mode=restore)
  offsets_dir: null         # where the <plot>_offsets.yml live; null = output_dir
  # laz (default) = compressed LAS 1.4 with the source scales + CRS re-applied and all
  # extra fields (labels, predictions) kept as extra-bytes dimensions; las = same,
  # uncompressed; ply = plain PLY.
  restore_format: laz

  # --- Run control ---
  plots: null               # null = all plots; or a list like [plot_01, plot_05]
  overwrite: true           # false = skip plots whose output file already exists
  dry_run: false
  continue_on_error: true

  # --- Parallelism (same semantics as class_unifier above; pipeline/parallel.py) ---
  # Applies to BOTH modes: preprocess and restore.
  workers: null             # null = memory-budgeted; int caps it; 1 = inline as before
  memory_budget_frac: 0.7
  bytes_per_point: 140      # MEASURED: plot_09, 72.6M pts -> 9.1 GB peak
