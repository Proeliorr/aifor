# Pipeline settings. One section per stage; each entry script reads only its own.
# Override on the CLI with the section prefix, e.g. `chain.plots=[plot_01]`.
#
# Every key below is documented in README.md -> "Configuration reference".

# --- Machine-specific locations ---------------------------------------------
paths:
  assignment: D:\Podyplomowe\04_AI_Intro\assignment
  forainet: ${paths.assignment}\ForAINet\PointCloudSegmentation
  forainet_dataroot: ${paths.forainet}\data_set1_5classes
  forainet_raw: ${paths.forainet_dataroot}\treeinsfused\raw\SegmentedForests   # ForAINet globs this; not a free choice
  offsets: ${paths.assignment}\SegmentedForests\ForAINet_input                 # small, tracked, makes restore possible
  export: ${paths.assignment}\SegmentedForests\ForAINet_export                 # Stage 2 LAZ export, ready to upload

# --- Label scheme, shared by class_unifier and forainet_prep -----------------
# Edit here, not on the CLI: the integer keys break Hydra overrides (see README).
classes:
  semantic_field: Class
  tree_id_field: tree_ID
  unified_field: semantic_seg          # name of the new column receiving the remapped labels
  drop_value: -1                       # points mapped here are deleted; nothing maps here today
  class_map:                           # {source Class: ForAINet semantic_seg} — must cover EVERY class present
    # -> 0 unclassified (no ForAINet counterpart; ForAINet ignores these in the loss)
    8: 0
    9: 0
    11: 0
    # -> 1 low_vegetation
    0: 1
    4: 1
    5: 1
    6: 1
    7: 1
    12: 1
    13: 1
    22: 1
    23: 1
    # -> 2 ground
    1: 2
    # -> 3 stem_points
    3: 3
    10: 3
    # -> 4 live_branches
    2: 4
  class_names:
    0: unclassified
    1: low_vegetation
    2: ground
    3: stem_points
    4: live_branches
  instance_classes: [3, 4]             # the tree ("thing") classes; tree id is zeroed outside them. null = leave ids alone

# --- The chain: both stages, per plot — python main_pipeline.py --------------
chain:
  stages: [threedfin, forainet_prep]   # [threedfin] = Stage 1 only; [forainet_prep] = Stage 2 only
  keep_intermediates: false            # true = keep every 3DFin .las; or a list of plot names to keep just those
  plots: null                          # null = all; or [plot_01, plot_05]
  overwrite: false                     # false = skip plots whose final output exists (resume)
  dry_run: false
  continue_on_error: true

# --- Stage 1: 3DFin instance segmentation (engine: pipeline/threedfin.py) ----
threedfin:
  pointclouds_dir: ${paths.assignment}\SegmentedForests\pointclouds
  ini_dir:         ${paths.assignment}\SegmentedForests\3DFin_settings
  output_dir:      ${paths.assignment}\SegmentedForests\3DFin_output
  threedfin_bin: C:/ProgramData/miniforge3/envs/aifor/Scripts/3DFin.exe
  normalize: null                      # null = derive from each plot's .ini [misc]; true/false = force
  denoise: null
  export_txt: null
  pattern: "*.laz"
  plots: null
  prune_outputs: true                  # keep only <plot>_tree_ID_dist_axes.las + 3dfin_log.txt
  dry_run: false
  continue_on_error: true

# --- Diagnostics (optional): inspect a class merge — python class_unifier.py -
class_unifier:
  input_dir:  ${paths.assignment}\SegmentedForests\3DFin_output
  patterns: ["*.las", "*.laz", "*.ply"]
  output_dir: ${paths.assignment}\SegmentedForests\ClassUnifier_output
  output_format: ply                   # ply | npy | both — use ply to view (README)
  semantic_field: ${classes.semantic_field}
  tree_id_field: ${classes.tree_id_field}
  intensity_field: null                # null = auto-detect
  unified_field: ${classes.unified_field}
  class_map: ${classes.class_map}
  drop_value: ${classes.drop_value}
  class_names: ${classes.class_names}
  plots: null
  overwrite: true
  dry_run: false
  continue_on_error: true
  workers: null                        # null = as many as RAM allows; int caps it; 1 = inline
  memory_budget_frac: 0.7
  bytes_per_point: 140                 # measured peak RSS per point

# --- Stage 2: center + write the training clouds / restore — python forainet_prep.py
forainet_prep:
  mode: preprocess                     # preprocess | restore
  input_dir:  ${paths.assignment}\SegmentedForests\3DFin_output
  patterns: ["*.las", "*.laz", "*.ply"]
  output_dir: ${paths.export}
  output_format: laz                   # laz | las | ply — ply is ~7x bigger; pair ply with output_dir: ${paths.forainet_raw}
  semantic_field: ${classes.semantic_field}
  tree_id_field: ${classes.tree_id_field}
  intensity_field: null                # null = auto-detect
  class_map: ${classes.class_map}
  drop_value: ${classes.drop_value}
  instance_classes: ${classes.instance_classes}
  split:                               # ForAINet reads the split from the FILE NAME; smallest plots held out
    n_val: 1                           # a count, or a fraction of the plots (0.1 = 10%). null split = plain <plot>.ply
    n_test: 2
  restore_dir: null                    # required for mode=restore
  offsets_dir: ${paths.offsets}        # where <plot>_offsets.yml live, in BOTH modes
  restore_format: laz                  # laz | las | ply
  plots: null
  overwrite: true
  dry_run: false
  continue_on_error: true
  workers: null
  memory_budget_frac: 0.7
  bytes_per_point: 140

# --- Format conversion (optional) — python convert.py -----------------------
# Expands the LAZ export back into the PLYs ForAINet reads. Normally run INSIDE the
# training container, where there is no Hydra:
#   python -m pipeline.convert --to ply /data/export /workspace/.../raw/SegmentedForests
convert:
  input_dir:  ${paths.export}
  output_dir: ${paths.forainet_raw}
  to: ply                              # ply | laz | las — files already in this format are skipped
  patterns: ["*.laz", "*.las", "*.ply"]
  offsets_dir: ${paths.offsets}        # only read when writing LAS/LAZ from a PLY (scales + CRS)
  plots: null
  overwrite: true
  dry_run: false
  continue_on_error: true
  workers: null
  memory_budget_frac: 0.7
  bytes_per_point: 140
